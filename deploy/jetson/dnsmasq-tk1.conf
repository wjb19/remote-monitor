# DHCP for the TK1 on the Jetson eth0 point-to-point link only.
# Do not listen on Wi-Fi / the house LAN.
interface=eth0
bind-interfaces
except-interface=wlan0
except-interface=lo
except-interface=docker0
port=0
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/rmlab-tk1-dhcp.leases
# Single-host pool: only the reserved TK1 address is ever handed out.
dhcp-range=192.168.8.2,192.168.8.2,255.255.255.0,12h
dhcp-option=option:router,192.168.8.1
dhcp-option=option:dns-server,192.168.8.1
# Waveshare/NVIDIA TK1 eth0 MAC (see docs/tk1.md).
dhcp-host=00:04:4b:2c:20:0d,192.168.8.2,tk1,12h
log-dhcp
