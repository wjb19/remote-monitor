; Custom LoRa-E5 firmware: ADS1115 (MQ-2/8/135/5) on the module I2C bus.
; Stock Seeed AT firmware cannot talk I2C — flashing this replaces it (SWD).
;
; Board: Seeed LoRa-E5 mini / Wio-E5 (STM32WLE5JC)
; I2C:   SDA=PA15, SCL=PB15  (Grove I2C on the E5 breakout)
; ADC:   ADS1115 @ 0x48, A0=MQ-2, A1=MQ-8, A2=MQ-135, A3=MQ-5

[env:lora_e5_mini]
platform = ststm32
board = lora_e5_mini
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 9600
lib_deps =
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/Adafruit BusIO@^1.16.1
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
